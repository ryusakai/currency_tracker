<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USD/JPY Rate Tracker — Material</title>
  <link rel="icon" href="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/96153a02-d413-464b-a514-f16c17506c09/f13d7251-590b-4379-ac81-1c1b9f4dfef5/original_repo/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #b3261e;
      --bg: #fff;
      --fg: #000;
      --secondary: #6750a4;
      --muted: #49454f;
      --muted-bg: #f3edf7;
      --border: #cac4d0;
      --surface: #fef7ff;
      --radius: 100px;
      --radius-card: 28px;
      --spacing: 18px;
      --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --max-width: 740px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-size: 16px;
      line-height: 24px;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: var(--spacing) calc(var(--spacing) * 2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-bar-logo {
      height: 28px;
      width: auto;
    }
    .app-bar-brand {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .app-bar-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      margin-left: calc(var(--spacing) * 1.5);
      padding-bottom: 4px;
      border-bottom: 3px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .app-bar-nav a:hover,
    .app-bar-nav a.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--spacing) * 2);
    }

    .title-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--spacing) * 2);
      margin-bottom: calc(var(--spacing) * 2);
      transition: box-shadow 0.2s;
    }
    .title-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .pair-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .current-rate {
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--fg);
    }
    .current-rate .currency {
      color: var(--muted);
      font-size: 0.5em;
      font-weight: 400;
    }
    .rate-date {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .range-bar {
      display: flex;
      gap: 8px;
      margin-bottom: calc(var(--spacing) * 1.5);
      flex-wrap: wrap;
    }
    .range-btn {
      font-family: var(--font);
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 24px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .range-btn:hover {
      background: rgba(103, 80, 164, 0.1);
      color: var(--secondary);
      border-color: var(--secondary);
    }
    .range-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--spacing) * 1.5);
      margin-bottom: calc(var(--spacing) * 2);
      transition: box-shadow 0.2s;
    }
    .chart-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .chart-wrap {
      position: relative;
      height: 340px;
    }

    .table-header {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 40px;
      margin-bottom: var(--spacing);
      color: var(--fg);
    }
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .table-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      padding: calc(var(--spacing) * 0.75) var(--spacing);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    tbody td {
      padding: calc(var(--spacing) * 0.6) var(--spacing);
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(103, 80, 164, 0.04); }
    .change-up { color: #2e7d32; }
    .change-down { color: var(--primary); }

    .back-link {
      display: inline-block;
      margin-bottom: var(--spacing);
      color: var(--secondary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav class="app-bar">
    <div class="app-bar-left">
      <img class="app-bar-logo" src="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/96153a02-d413-464b-a514-f16c17506c09/f13d7251-590b-4379-ac81-1c1b9f4dfef5/original_repo/material%203%20logo.png" alt="Material logo">
      <a class="app-bar-brand" href="index.html">Material</a>
    </div>
    <div class="app-bar-nav">
      <a href="#" class="active">USD/JPY</a>
      <a href="index.html">← All Designs</a>
    </div>
  </nav>

  <div class="container">
    <div class="title-card">
      <div class="pair-label">USD / JPY</div>
      <div class="current-rate">USD/JPY: 160.25 <span class="currency">JPY</span></div>
      <div class="rate-date">As of June 18, 2025</div>
    </div>

    <div class="range-bar">
      <button class="range-btn" data-range="1M">1M</button>
      <button class="range-btn" data-range="3M">3M</button>
      <button class="range-btn" data-range="6M">6M</button>
      <button class="range-btn active" data-range="1Y">1Y</button>
      <button class="range-btn" data-range="5Y">5Y</button>
    </div>

    <div class="chart-card">
      <div class="chart-wrap">
        <canvas id="rateChart"></canvas>
      </div>
    </div>

    <h2 class="table-header">Historical Rates</h2>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Rate</th>
            <th>Change</th>
            <th>% Change</th>
          </tr>
        </thead>
        <tbody id="rateTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    initApp({
      primary: '#b3261e',
      bg: '#fff',
      fg: '#000',
      muted: '#49454f',
      border: '#cac4d0',
      radius: '100px',
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
    });
  </script>
</body>
</html>
