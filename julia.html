<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USD/JPY Rate Tracker — julia</title>
  <link rel="icon" href="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/6c0a564a-42cd-4108-bb37-381e710387fe/574e5741-35b8-4496-80d6-b8436f38184e/original_repo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #d16b86;
      --bg: #fcf4f6;
      --fg: #111827;
      --muted: #6b7280;
      --muted-bg: hsla(345, 57%, 97%, 1);
      --border: hsla(222, 23%, 71%, 0.2);
      --surface: hsla(0, 0%, 100%, 1);
      --navbar-bg: hsla(216, 14%, 14%, 1);
      --charcoal: hsla(219, 22%, 26%, 1);
      --radius: 100px;
      --radius-card: 24px;
      --spacing: 32px;
      --font: 'Manrope', sans-serif;
      --max-width: 740px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-size: 16px;
      line-height: 24px;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--navbar-bg);
      padding: 16px calc(var(--spacing));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-bar-logo {
      height: 28px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .app-bar-brand {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .app-bar-nav a {
      color: hsla(0, 0%, 100%, 0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-left: calc(var(--spacing));
      padding: 4px 12px;
      border-radius: var(--radius);
      transition: background 0.2s, color 0.2s;
    }
    .app-bar-nav a:hover {
      color: #fff;
      background: hsla(0, 0%, 100%, 0.08);
    }
    .app-bar-nav a.active {
      color: #fff;
      background: var(--primary);
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--spacing);
    }

    .title-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--spacing) * 0.85);
      margin-bottom: var(--spacing);
      transition: box-shadow 0.2s;
    }
    .title-card:hover {
      box-shadow: 0 8px 24px rgba(209, 107, 134, 0.12);
    }
    .pair-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .current-rate {
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--fg);
    }
    .current-rate .currency {
      color: var(--muted);
      font-size: 0.5em;
      font-weight: 400;
    }
    .rate-date {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .range-bar {
      display: flex;
      gap: 8px;
      margin-bottom: calc(var(--spacing) * 0.75);
      flex-wrap: wrap;
    }
    .range-btn {
      font-family: var(--font);
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 24px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .range-btn:hover {
      background: hsla(344, 53%, 62%, 0.08);
      color: var(--primary);
      border-color: var(--primary);
    }
    .range-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--spacing) * 0.75);
      margin-bottom: var(--spacing);
      transition: box-shadow 0.2s;
    }
    .chart-card:hover {
      box-shadow: 0 8px 24px rgba(209, 107, 134, 0.12);
    }
    .chart-wrap {
      position: relative;
      height: 340px;
    }

    .table-header {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 40px;
      margin-bottom: calc(var(--spacing) * 0.5);
      color: var(--fg);
    }
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .table-card:hover {
      box-shadow: 0 8px 24px rgba(209, 107, 134, 0.12);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    tbody td {
      padding: 12px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: hsla(344, 53%, 62%, 0.04); }
    .change-up { color: #059669; }
    .change-down { color: #dc2626; }

    .back-link {
      display: inline-block;
      margin-bottom: calc(var(--spacing) * 0.5);
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav class="app-bar">
    <div class="app-bar-left">
      <img class="app-bar-logo" src="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/6c0a564a-42cd-4108-bb37-381e710387fe/574e5741-35b8-4496-80d6-b8436f38184e/original_repo/assets/images/logo-dark.svg" alt="julia logo">
      <a class="app-bar-brand" href="index.html">julia</a>
    </div>
    <div class="app-bar-nav">
      <a href="#" class="active">USD/JPY</a>
      <a href="index.html">← All Designs</a>
    </div>
  </nav>

  <div class="container">
    <div class="title-card">
      <div class="pair-label">USD / JPY</div>
      <div class="current-rate">USD/JPY: 160.25 <span class="currency">JPY</span></div>
      <div class="rate-date">As of June 18, 2025</div>
    </div>

    <div class="range-bar">
      <button class="range-btn" data-range="1M">1M</button>
      <button class="range-btn" data-range="3M">3M</button>
      <button class="range-btn" data-range="6M">6M</button>
      <button class="range-btn active" data-range="1Y">1Y</button>
      <button class="range-btn" data-range="5Y">5Y</button>
    </div>

    <div class="chart-card">
      <div class="chart-wrap">
        <canvas id="rateChart"></canvas>
      </div>
    </div>

    <h2 class="table-header">Historical Rates</h2>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Rate</th>
            <th>Change</th>
            <th>% Change</th>
          </tr>
        </thead>
        <tbody id="rateTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    initApp({
      primary: '#d16b86',
      bg: '#fcf4f6',
      fg: '#111827',
      muted: '#6b7280',
      border: 'hsla(222, 23%, 71%, 0.2)',
      radius: '100px',
      fontFamily: "'Manrope', sans-serif",
    });
  </script>
</body>
</html>
