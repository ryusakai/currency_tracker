<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USD/JPY Rate Tracker — RealWorldUX</title>
  <link rel="icon" href="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/f10c3f6b-f6b0-4697-945b-8d6d1273db7a/1d979043-ca4f-4a2e-92c8-2d9bc5058604/original_repo/public/image/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #0071bc;
      --bg: rgb(255, 255, 255);
      --fg: rgb(40, 40, 40);
      --secondary: rgba(52, 173, 163, 0.8);
      --muted: rgb(116, 116, 116);
      --muted-bg: rgba(180, 180, 180, 0.2);
      --border: rgba(180, 180, 180, 0.35);
      --surface: rgb(255, 255, 255);
      --radius: 8px;
      --radius-full: 9999px;
      --spacing: 16px;
      --font: "Asap Condensed", sans-serif;
      --max-width: 900px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-size: 16px;
      line-height: 24px;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: var(--spacing) calc(var(--spacing) * 2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-bar-logo {
      height: 28px;
      width: auto;
    }
    .app-bar-brand {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    .app-bar-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-left: calc(var(--spacing) * 2);
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .app-bar-nav a:hover,
    .app-bar-nav a.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--spacing) * 2);
    }

    .title-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: calc(var(--spacing) * 1.5);
      margin-bottom: calc(var(--spacing) * 2);
      transition: border-color 0.2s;
    }
    .title-card:hover {
      border-color: var(--primary);
    }
    .pair-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .current-rate {
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--fg);
    }
    .current-rate .currency {
      color: var(--muted);
      font-size: 0.5em;
      font-weight: 400;
    }
    .rate-date {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .range-bar {
      display: flex;
      gap: 8px;
      margin-bottom: calc(var(--spacing) * 1.5);
      flex-wrap: wrap;
    }
    .range-btn {
      font-family: var(--font);
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .range-btn:hover {
      background: rgba(0, 113, 188, 0.08);
      color: var(--primary);
      border-color: var(--primary);
    }
    .range-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: calc(var(--spacing) * 1.5);
      margin-bottom: calc(var(--spacing) * 2);
      transition: border-color 0.2s;
    }
    .chart-card:hover {
      border-color: var(--primary);
    }
    .chart-wrap {
      position: relative;
      height: 340px;
    }

    .table-header {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 40px;
      margin-bottom: var(--spacing);
      color: var(--fg);
    }
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .table-card:hover {
      border-color: var(--primary);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px var(--spacing);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    tbody td {
      padding: 10px var(--spacing);
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(0, 113, 188, 0.04); }
    .change-up { color: #0a7c42; }
    .change-down { color: #c62828; }

    .back-link {
      display: inline-block;
      margin-bottom: var(--spacing);
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav class="app-bar">
    <div class="app-bar-left">
      <img class="app-bar-logo" src="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/f10c3f6b-f6b0-4697-945b-8d6d1273db7a/1d979043-ca4f-4a2e-92c8-2d9bc5058604/original_repo/public/image/RealWorldUX_logo_blue.svg" alt="RealWorldUX logo">
      <a class="app-bar-brand" href="index.html">RealWorldUX</a>
    </div>
    <div class="app-bar-nav">
      <a href="#" class="active">USD/JPY</a>
      <a href="index.html">← All Designs</a>
    </div>
  </nav>

  <div class="container">
    <div class="title-card">
      <div class="pair-label">USD / JPY</div>
      <div class="current-rate">USD/JPY: 160.25 <span class="currency">JPY</span></div>
      <div class="rate-date">As of June 18, 2025</div>
    </div>

    <div class="range-bar">
      <button class="range-btn" data-range="1M">1M</button>
      <button class="range-btn" data-range="3M">3M</button>
      <button class="range-btn" data-range="6M">6M</button>
      <button class="range-btn active" data-range="1Y">1Y</button>
      <button class="range-btn" data-range="5Y">5Y</button>
    </div>

    <div class="chart-card">
      <div class="chart-wrap">
        <canvas id="rateChart"></canvas>
      </div>
    </div>

    <h2 class="table-header">Historical Rates</h2>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Rate</th>
            <th>Change</th>
            <th>% Change</th>
          </tr>
        </thead>
        <tbody id="rateTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    initApp({
      primary: '#0071bc',
      bg: 'rgb(255,255,255)',
      fg: 'rgb(40,40,40)',
      muted: 'rgb(116,116,116)',
      border: 'rgba(180,180,180,0.35)',
      radius: '8px',
      fontFamily: '"Asap Condensed", sans-serif',
    });
  </script>
</body>
</html>
