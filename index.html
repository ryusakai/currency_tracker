<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USD/JPY rate</title>
  <link rel="icon" href="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/f10c3f6b-f6b0-4697-945b-8d6d1273db7a/1d979043-ca4f-4a2e-92c8-2d9bc5058604/original_repo/public/image/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <img class="header-logo" src="https://api.dfactor.ai/static/design-system-customer/c90c23a0-a9f6-4787-a6ae-396bf634286d/f10c3f6b-f6b0-4697-945b-8d6d1273db7a/1d979043-ca4f-4a2e-92c8-2d9bc5058604/original_repo/public/image/RealWorldUX_logo_blue.svg" alt="RealWorldUX" />
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" class="site-nav-link is-active" aria-current="page">USD/JPY</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-title-row">
      <h1>USD/JPY rate</h1>
      <p class="page-title-meta" id="as-of"></p>
    </div>

    <section class="summary-grid" id="summary-grid" aria-label="Rate summary"></section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-start">
          <h2>Rate history</h2>
          <div class="range-tabs" role="group" aria-label="Date range">
            <button type="button" class="range-btn" data-range="1M">1M</button>
            <button type="button" class="range-btn" data-range="3M">3M</button>
            <button type="button" class="range-btn" data-range="6M">6M</button>
            <button type="button" class="range-btn is-active" data-range="1Y">1Y</button>
            <button type="button" class="range-btn" data-range="5Y">5Y</button>
            <button type="button" class="range-btn" data-range="10Y">10Y</button>
            <button type="button" class="range-btn" data-range="20Y">20Y</button>
            <button type="button" class="range-btn" data-range="30Y">30Y</button>
            <button type="button" class="range-btn" data-range="40Y">40Y</button>
          </div>
        </div>
        <div class="chart-legend">
          <span class="chart-legend-item"><span class="chart-legend-swatch"></span>USD/JPY</span>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="rateChart"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-start">
          <h2>Historical rates</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th class="num">Rate</th>
              <th class="num">Change</th>
              <th class="num">% Change</th>
            </tr>
          </thead>
          <tbody id="rateTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="latest-reading">Monthly USD/JPY rates.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
