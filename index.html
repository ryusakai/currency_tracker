<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USD/JPY — Design System Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .launcher {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; color: #222; }
    p { color: #666; margin-bottom: 32px; line-height: 1.5; }
    .cards { display: flex; flex-direction: column; gap: 16px; }
    a.card {
      display: block;
      padding: 24px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    a.card .sub { font-weight: 400; font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .card-material { background: #b3261e; }
    .card-realworldux { background: #0071bc; }
    .card-julia { background: #d16b86; }
  </style>
</head>
<body>
  <div class="launcher">
    <h1>USD/JPY Rate Tracker</h1>
    <p>Three versions of the same website, each styled with a different design system exported from Dfactor.</p>
    <div class="cards">
      <a class="card card-material" href="material.html">
        Material Design
        <div class="sub">Monospace · Pill shapes · Red accent</div>
      </a>
      <a class="card card-realworldux" href="realworldux.html">
        RealWorldUX Design
        <div class="sub">Asap Condensed · 8px radius · Blue accent</div>
      </a>
      <a class="card card-julia" href="julia.html">
        Julia Design
        <div class="sub">Manrope · Pill shapes · Pink accent</div>
      </a>
    </div>
  </div>
</body>
</html>
